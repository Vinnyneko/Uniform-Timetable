<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sport & Formal Uniform Planner</title>

  <style>
    :root {
      color-scheme: light;
      --page-bg: #edf1f5;
      --surface: #ffffff;
      --text: #202938;
      --muted: #687386;
      --border: #dce3ed;
      --header-bg: #f4f6f9;
      --accent: #3159a5;
      --input-bg: #f8fafc;
      --input-border: #e3e8ef;
    }

    body.dark-mode {
      color-scheme: dark;
      --page-bg: #151923;
      --surface: #202633;
      --text: #e8edf6;
      --muted: #aab4c5;
      --border: #3a4557;
      --header-bg: #293242;
      --accent: #8eafff;
      --input-bg: #252d3a;
      --input-border: #3a4557;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 28px 16px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--page-bg);
    }

    .planner {
      width: min(100%, 1050px);
      margin: 0 auto;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 14px 40px #22324a14;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .actions,
    .quick-options {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    select,
    button {
      min-height: 38px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font: inherit;
      background: var(--surface);
    }

    select,
    button {
      cursor: pointer;
    }

    button:hover,
    select:hover {
      border-color: var(--accent);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.4rem;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .quick-options {
      justify-content: center;
      margin: 0 0 18px;
    }

    .quick-option {
      min-width: 100px;
      border-radius: 999px;
    }

    .quick-option[aria-pressed="true"] {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent);
    }

    .week-heading {
      margin: 0 0 14px;
      font-size: 1.1rem;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 9px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    thead th {
      height: 48px;
      background: var(--header-bg);
      font-size: 0.92rem;
    }

    tbody tr:last-child th,
    tbody tr:last-child td {
      border-bottom: 0;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    .time-column {
      width: 120px;
    }

    .time-cell {
      color: var(--muted);
      font-size: 0.84rem;
      white-space: nowrap;
    }

    td input,
    td textarea {
      display: block;
      width: 100%;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      background: var(--input-bg);
    }

    td input {
      min-height: 42px;
      padding: 8px;
    }

    td textarea {
      min-height: 72px;
      padding: 8px;
      resize: vertical;
    }

    td input:focus,
    td textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .status {
      min-height: 20px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: right;
    }

    @media (max-width: 600px) {
      .planner {
        padding: 16px;
        border-radius: 16px;
      }

      .top-bar {
        align-items: flex-start;
      }

      .actions {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="planner">
    <header class="top-bar">
      <div>
        <h1>Sport & Formal Uniform Planner</h1>
        <p class="subtitle">Plan your uniform by week and day.</p>
      </div>

      <div class="actions">
        <label for="yearSelect">
          Year
          <select id="yearSelect">
            <option>Year 7</option>
            <option>Year 8</option>
            <option selected>Year 9</option>
            <option>Year 10</option>
            <option>Year 11</option>
            <option>Year 12</option>
          </select>
        </label>

        <label for="termSelect">
          Term
          <select id="termSelect">
            <option>Term 1</option>
            <option>Term 2</option>
            <option selected>Term 3</option>
            <option>Term 4</option>
          </select>
        </label>

        <label for="weekSelect">
          Week
          <select id="weekSelect"></select>
        </label>

        <button id="themeButton" type="button" aria-label="Switch to dark mode">
          ☾
        </button>
      </div>
    </header>

    <div class="quick-options" role="group" aria-label="Choose planner type">
      <button class="quick-option" type="button" data-mode="formal" aria-pressed="false">
        Formal
      </button>
      <button class="quick-option" type="button" data-mode="sport" aria-pressed="false">
        Sport
      </button>
      <button class="quick-option" type="button" data-mode="both" aria-pressed="true">
        Both
      </button>
    </div>

    <h2 class="week-heading" id="weekHeading">Week 1</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="time-column">Time</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
            <th id="uniformHeader">Formal uniform</th>
          </tr>
        </thead>
        <tbody id="plannerBody"></tbody>
      </table>
    </div>

    <p class="status" id="status" aria-live="polite"></p>
  </main>

  <script>
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];

    const periods = [
      { name: "Before school", time: "Before school" },
      { name: "Period 1", time: "8:48–9:48" },
      { name: "Period 2", time: "9:50–10:50" },
      { name: "Period 3", time: "11:32–12:32" },
      { name: "Period 4", time: "12:34–1:34" },
      { name: "Period 5", time: "1:56–2:56" }
    ];

    const storageKey = "sportFormalUniformPlanner";
    const modeStorageKey = "sportFormalPlannerMode";

    const weekSelect = document.getElementById("weekSelect");
    const plannerBody = document.getElementById("plannerBody");
    const weekHeading = document.getElementById("weekHeading");
    const uniformHeader = document.getElementById("uniformHeader");
    const status = document.getElementById("status");
    const themeButton = document.getElementById("themeButton");
    const quickOptionButtons = document.querySelectorAll(".quick-option");

    let plannerData = {};

    try {
      plannerData = JSON.parse(localStorage.getItem(storageKey)) || {};
    } catch {
      plannerData = {};
    }

    let currentMode = localStorage.getItem(modeStorageKey) || "both";
    if (!["formal", "sport", "both"].includes(currentMode)) {
      currentMode = "both";
    }

    for (let week = 1; week <= 10; week++) {
      const option = document.createElement("option");
      option.value = String(week);
      option.textContent = `Week ${week}`;
      weekSelect.appendChild(option);
    }

    function savePlannerData() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(plannerData));
        status.textContent = "Changes saved on this device.";
      } catch {
        status.textContent = "Could not save. Check your browser storage settings.";
      }
    }

    function getWeekData(week) {
      if (!plannerData[week]) {
        plannerData[week] = { sports: {}, uniforms: {} };
      }

      plannerData[week].sports ||= {};
      plannerData[week].uniforms ||= {};

      return plannerData[week];
    }

    function createInput(week, day, periodIndex) {
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Add sport / activity";
      input.setAttribute(
        "aria-label",
        `Week ${week}, ${day}, ${periods[periodIndex].name} sport or activity`
      );
      input.value = getWeekData(week).sports[day]?.[periodIndex] || "";

      input.addEventListener("input", () => {
        const weekData = getWeekData(week);
        weekData.sports[day] ||= {};
        weekData.sports[day][periodIndex] = input.value;
        savePlannerData();
      });

      return input;
    }

    function createNotes(week, day, placeholder) {
      const textarea = document.createElement("textarea");
      textarea.placeholder = placeholder;
      textarea.setAttribute("aria-label", `Week ${week}, ${day}, ${placeholder}`);
      textarea.value = getWeekData(week).uniforms[day] || "";

      textarea.addEventListener("input", () => {
        getWeekData(week).uniforms[day] = textarea.value;
        savePlannerData();
      });

      return textarea;
    }

    function updateQuickOptions() {
      quickOptionButtons.forEach((button) => {
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.mode === currentMode)
        );
      });

      uniformHeader.textContent =
        currentMode === "formal" ? "Formal uniform" :
        currentMode === "sport" ? "Sport uniform" :
        "Formal & sport notes";
    }

    function drawPlanner() {
      const week = weekSelect.value;
      weekHeading.textContent = `Week ${week}`;
      plannerBody.replaceChildren();
      updateQuickOptions();

      periods.forEach((period, periodIndex) => {
        const row = document.createElement("tr");
        const timeCell = document.createElement("th");

        timeCell.className = "time-cell";
        timeCell.textContent = period.time;
        row.appendChild(timeCell);

        days.forEach((day) => {
          const cell = document.createElement("td");

          if (currentMode !== "formal") {
            cell.appendChild(createInput(week, day, periodIndex));
          }

          row.appendChild(cell);
        });

        const notesCell = document.createElement("td");

        if (periodIndex === 0) {
          notesCell.rowSpan = periods.length;
          notesCell.appendChild(
            createNotes(
              week,
              days[0],
              currentMode === "formal"
                ? "Formal uniform notes"
                : currentMode === "sport"
                  ? "Sport uniform notes"
                  : "Formal and sport notes"
            )
          );
          row.appendChild(notesCell);
        }

        plannerBody.appendChild(row);
      });
    }

    quickOptionButtons.forEach((button) => {
      button.addEventListener("click", () => {
        currentMode = button.dataset.mode;
        localStorage.setItem(modeStorageKey, currentMode);
        drawPlanner();
      });
    });

    weekSelect.addEventListener("change", drawPlanner);

    const savedTheme = localStorage.getItem("sportPlannerTheme");
    if (savedTheme === "dark") {
      document.body.classList.add("dark-mode");
      themeButton.textContent = "☀";
      themeButton.setAttribute("aria-label", "Switch to light mode");
    }

    themeButton.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark-mode");
      localStorage.setItem("sportPlannerTheme", isDark ? "dark" : "light");
      themeButton.textContent = isDark ? "☀" : "☾";
      themeButton.setAttribute(
        "aria-label",
        isDark ? "Switch to light mode" : "Switch to dark mode"
      );
    });

    drawPlanner();
  </script>
</body>
</html>
``
